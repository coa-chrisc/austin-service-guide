# Translated service descriptions for the results page, keyed by catalog
# service slug, then language code. Optional file: a service or language
# without an entry shows the English catalog description.
heat-relief-ac-assistance:
  vi:
    description: Hỗ trợ tài chính một lần để sửa máy lạnh, thay máy lạnh, hoặc mua máy lạnh cửa sổ cho cư dân đủ điều kiện theo thu nhập — ưu tiên người cao tuổi, người làm ngoài trời và hộ có bệnh mãn tính.
  es:
    description: Asistencia financiera única para reparación de aire acondicionado, reemplazo de unidad o compra de aparato de ventana para residentes que califican por ingresos — con prioridad para adultos mayores, trabajadores al aire libre y hogares con condiciones crónicas.
  zh:
    description: 为符合收入条件的居民提供一次性空调维修、空调更换或窗式空调购置的经济援助——优先帮助老年人、户外工作者以及有慢性病的家庭。
  ar:
    description: مساعدة مالية لمرة واحدة لإصلاح المكيف أو استبدال الوحدة أو شراء مكيف نوافذ للسكان المؤهلين حسب الدخل — مع الأولوية لكبار السن والعاملين في الهواء الطلق والأسر التي بها أمراض مزمنة.
austin-public-health-wic:
  vi:
    description: Chương trình WIC (Phụ nữ, Trẻ sơ sinh và Trẻ em) cung cấp thực phẩm bổ dưỡng, giáo dục dinh dưỡng, hỗ trợ cho con bú và giới thiệu đến dịch vụ y tế và cộng đồng.
  es:
    description: El programa WIC (Mujeres, Bebés y Niños) ofrece alimentos nutritivos, educación nutricional, apoyo a la lactancia y referencias a servicios de salud y comunitarios.
  zh:
    description: WIC（妇女、婴儿和儿童）项目提供营养食品、营养教育、母乳喂养支持，以及到医疗和社区服务的转介。
  ar:
    description: برنامج WIC (للنساء والرضع والأطفال) يقدم أغذية مغذية وتثقيفاً غذائياً ودعماً للرضاعة الطبيعية وإحالات إلى الخدمات الصحية والمجتمعية.
community-care-health-centers:
  vi:
    description: Trung tâm Y tế được Liên bang Công nhận cung cấp chăm sóc ban đầu, nha khoa, sức khỏe hành vi và dược phẩm theo mức phí trượt — không phân biệt tình trạng bảo hiểm.
  es:
    description: Centro de Salud Calificado Federalmente que ofrece atención primaria, dental, salud conductual y farmacia con tarifas según ingresos, sin importar el estado del seguro.
  zh:
    description: 联邦合格医疗中心，按收入梯度收费提供初级医疗、牙科、行为健康和药房服务——不论保险状况。
  ar:
    description: مركز صحي معتمد فيدرالياً يقدم رعاية أولية وطب أسنان وصحة سلوكية وصيدلية برسوم متدرجة — بغض النظر عن وضع التأمين.
cooling-center-network:
  vi:
    description: Mạng lưới các thư viện và cơ sở thành phố mở rộng giờ làm trong các đợt cảnh báo nhiệt — không gian mát có máy lạnh, miễn phí cho mọi cư dân.
  es:
    description: Red de bibliotecas e instalaciones municipales con horario extendido durante alertas de calor — espacios con aire acondicionado, gratis para todos los residentes.
  zh:
    description: 在高温预警期间延长营业时间的图书馆和市政设施网络——有空调的凉爽空间，所有居民免费。
  ar:
    description: شبكة من المكتبات ومرافق المدينة بساعات عمل ممتدة خلال موجات الحر — أماكن باردة مكيفة ومجانية لجميع السكان.
head-start-austin:
  vi:
    description: Chương trình giáo dục mầm non miễn phí cho trẻ 3-5 tuổi từ gia đình thu nhập thấp. Bao gồm khám sàng lọc sức khỏe, bữa ăn dinh dưỡng và hỗ trợ chuẩn bị đi học.
  es:
    description: Programa gratuito de educación temprana para niños de 3 a 5 años de familias de bajos ingresos. Incluye evaluaciones de salud, comidas nutritivas y apoyo para la preparación escolar.
  zh:
    description: 为低收入家庭3-5岁儿童提供的免费幼儿教育项目。包括健康筛查、营养餐和入学准备支持。
  ar:
    description: برنامج تعليم طفولة مبكرة مجاني للأطفال من سن 3 إلى 5 سنوات من الأسر منخفضة الدخل. يشمل فحوصات صحية ووجبات مغذية ودعم الاستعداد للمدرسة.
aisd-prek-early-childhood:
  vi:
    description: Mẫu giáo cả ngày miễn phí cho trẻ 3-4 tuổi đủ điều kiện tại các trường tiểu học AISD, cùng với giáo dục đặc biệt mầm non và lớp song ngữ.
  es:
    description: Pre-K gratis de día completo para niños de 3 y 4 años elegibles en escuelas primarias de AISD, además de educación especial temprana y aulas de Pre-K bilingües.
  zh:
    description: 为符合条件的3至4岁儿童在AISD小学提供的免费全日制学前班，外加幼儿特殊教育和双语学前班。
  ar:
    description: روضة مجانية بدوام كامل للأطفال المؤهلين في سن 3 و4 سنوات في مدارس AISD الابتدائية، بالإضافة إلى تعليم خاص للطفولة المبكرة وفصول روضة ثنائية اللغة.
vida-clinic-schools:
  vi:
    description: Bác sĩ lâm sàng làm việc tại trường, cung cấp trị liệu, chăm sóc tâm thần và ứng phó khủng hoảng trong các trường tiểu học, trung học cơ sở và trung học AISD. Có cả khám trực tiếp và từ xa.
  es:
    description: Clínicos integrados que brindan terapia, atención psiquiátrica y respuesta a crisis dentro de las escuelas primarias, intermedias y secundarias de AISD. Sesiones presenciales y por telesalud disponibles.
  zh:
    description: 在AISD小学、初中和高中校内提供治疗、精神科护理和危机应对的嵌入式临床医生。可面诊或远程问诊。
  ar:
    description: أطباء سريريون مدمجون يقدمون العلاج والرعاية النفسية والاستجابة للأزمات داخل مدارس AISD الابتدائية والمتوسطة والثانوية. جلسات حضورية وعبر الإنترنت متاحة.
communities-in-schools:
  vi:
    description: Quản lý ca tại trường cho học sinh K-12 có nguy cơ bỏ học — chuyên viên tư vấn, nhân viên xã hội và huấn luyện viên học thuật được bố trí tại các trường AISD, Del Valle, Manor và Pflugerville ISD.
  es:
    description: Manejo de casos en la escuela para estudiantes K-12 en riesgo de abandonar — consejeros licenciados, trabajadores sociales y entrenadores académicos en planteles de AISD, Del Valle, Manor y Pflugerville ISD.
  zh:
    description: 为有辍学风险的K-12学生提供校园个案管理——持照辅导员、社工和学业教练驻校于AISD、Del Valle、Manor和Pflugerville ISD。
  ar:
    description: إدارة حالات في المدارس للطلاب من K-12 المعرضين لخطر التسرب — مستشارون مرخصون وأخصائيون اجتماعيون ومدربون أكاديميون في حرم مدارس AISD وDel Valle وManor وPflugerville ISD.
integral-care:
  vi:
    description: Cơ quan Sức khỏe Tinh thần Địa phương của Quận Travis cung cấp dịch vụ tâm thần, can thiệp khủng hoảng, điều trị nghiện và dịch vụ khuyết tật trí tuệ/phát triển.
  es:
    description: La Autoridad Local de Salud Mental del Condado de Travis brinda servicios psiquiátricos, intervención en crisis, tratamiento de uso de sustancias y servicios para discapacidades intelectuales/del desarrollo.
  zh:
    description: Travis县地方心理健康主管部门，提供精神科服务、危机干预、物质使用治疗以及智力/发育障碍服务。
  ar:
    description: السلطة المحلية للصحة النفسية في مقاطعة ترافيس تقدم خدمات نفسية وتدخل في الأزمات وعلاج إدمان المواد وخدمات للإعاقات الذهنية/التطورية.
family-eldercare-housing:
  vi:
    description: Nhà ở hỗ trợ thường trực và dịch vụ quản lý tiền cho người cao tuổi thu nhập thấp và người lớn khuyết tật, bao gồm các cộng đồng Lyons Gardens và Sherman Apartments.
  es:
    description: Vivienda permanente de apoyo y servicios de manejo de dinero para adultos mayores de bajos ingresos y adultos con discapacidades, incluyendo las comunidades Lyons Gardens y Sherman Apartments.
  zh:
    description: 为低收入老年人和残障成年人提供永久支持性住房和财务管理服务，包括Lyons Gardens和Sherman Apartments社区。
  ar:
    description: إسكان دائم داعم وخدمات إدارة المال لكبار السن منخفضي الدخل والبالغين ذوي الإعاقات، بما في ذلك مجتمعات Lyons Gardens وSherman Apartments.
austin-tenants-council:
  vi:
    description: Thông tin, tư vấn và hòa giải miễn phí về các vấn đề chủ nhà-người thuê. Giúp người thuê hiểu quyền của mình theo luật Texas, giải quyết tranh chấp và điều tra khiếu nại nhà ở công bằng.
  es:
    description: Información, asesoría y mediación gratis sobre asuntos de propietarios e inquilinos. Ayuda a los inquilinos a entender sus derechos bajo la ley de Texas, resuelve disputas e investiga quejas de vivienda justa.
  zh:
    description: 免费的房东-租客事务信息、咨询和调解服务。帮助租户了解德州法律下的权利，解决纠纷，并调查公平住房投诉。
  ar:
    description: معلومات واستشارات ووساطة مجانية في قضايا المالك والمستأجر. يساعد المستأجرين على فهم حقوقهم بموجب قانون تكساس وحل النزاعات والتحقيق في شكاوى الإسكان العادل.
iact-multifaith-food-pantry:
  vi:
    description: Kho thực phẩm phù hợp văn hóa phục vụ các gia đình tị nạn và nhập cư ở bắc Austin — thịt halal được chứng nhận, các loại thực phẩm chính (gạo, đậu lăng, gia vị) và sữa công thức cho trẻ. Tình nguyện viên song ngữ.
  es:
    description: Despensa de alimentos culturalmente apropiada para familias refugiadas e inmigrantes en el norte de Austin — carnes certificadas halal, alimentos básicos regionales (arroz, lentejas, especias) y fórmula infantil. Voluntarios bilingües.
  zh:
    description: 服务于北奥斯汀难民和移民家庭的具有文化敏感度的食物分发——清真认证肉类、地区主食（米、扁豆、香料）和婴儿配方奶粉。配有双语志愿者。
  ar:
    description: مخزن طعام يراعي الثقافة يخدم الأسر اللاجئة والمهاجرة في شمال أوستن — لحوم حلال معتمدة ومواد غذائية إقليمية أساسية (الأرز والعدس والبهارات) وحليب أطفال. متطوعون يتحدثون لغتين.
catholic-charities-of-central-texas:
  vi:
    description: Dịch vụ pháp lý nhập cư (DACA, nhập tịch, đơn bảo lãnh gia đình), tái định cư người tị nạn, tư vấn ổn định tài chính, kho thực phẩm và phục hồi sau thiên tai cho cư dân của mọi tôn giáo.
  es:
    description: Servicios legales de inmigración (DACA, ciudadanía, peticiones familiares), reasentamiento de refugiados, asesoría de estabilidad financiera, despensa de alimentos y recuperación de desastres para residentes de todas las creencias.
  zh:
    description: 移民法律服务（DACA、公民身份、家庭申请）、难民安置、财务稳定咨询、食物分发和灾后恢复，面向所有信仰的居民。
  ar:
    description: خدمات قانونية للهجرة (DACA، الجنسية، طلبات لم شمل العائلات)، إعادة توطين اللاجئين، استشارات الاستقرار المالي، مخزن طعام، والتعافي من الكوارث لسكان جميع الأديان.
multicultural-refugee-coalition:
  vi:
    description: Hỗ trợ hội nhập dài hạn cho các gia đình tị nạn và nhập cư sau giai đoạn tái định cư ban đầu. Các chương trình bao gồm New Leaf Agriculture (đào tạo nông nghiệp có trả lương), nhóm sức khỏe phụ nữ và cố vấn thanh thiếu niên.
  es:
    description: Apoyo de integración a largo plazo para familias refugiadas e inmigrantes después de la ventana inicial de reasentamiento. Programas como New Leaf Agriculture (capacitación agrícola pagada), círculos de bienestar para mujeres y mentoría juvenil.
  zh:
    description: 为初次安置期之后的难民和移民家庭提供长期融入支持。项目包括New Leaf Agriculture（带薪农业培训）、女性健康圈和青少年指导。
  ar:
    description: دعم اندماج طويل المدى للأسر اللاجئة والمهاجرة بعد فترة إعادة التوطين الأولى. تشمل البرامج New Leaf Agriculture (تدريب زراعي مدفوع) وحلقات صحة المرأة وإرشاد الشباب.
austin-public-library-adult-learning:
  vi:
    description: Dạy kèm xóa mù chữ cho người lớn miễn phí, giao tiếp tiếng Anh (Talk Time) và luyện thi nhập tịch tại các chi nhánh thư viện trên khắp Austin.
  es:
    description: Tutoría gratis de alfabetización para adultos uno a uno, inglés conversacional (Talk Time) y preparación para el examen de ciudadanía en sucursales de la biblioteca por todo Austin.
  zh:
    description: 在奥斯汀各分馆图书馆提供免费的一对一成人识字辅导、英语会话（Talk Time）和入籍考试备考。
  ar:
    description: دروس مجانية فردية لمحو أمية الكبار، ومحادثة باللغة الإنجليزية (Talk Time)، والتحضير لاختبار الجنسية في فروع المكتبة في جميع أنحاء أوستن.
vivent-health-austin:
  vi:
    description: Chăm sóc HIV, phòng ngừa và dịch vụ hỗ trợ bao gồm chăm sóc y tế và nha khoa, dược phẩm, tư vấn sức khỏe tâm thần, kho thực phẩm và quản lý ca cho người sống chung với HIV.
  es:
    description: Atención, prevención y servicios de apoyo para VIH incluyendo atención médica y dental, farmacia, consejería de salud mental, despensa de alimentos y manejo de casos para personas viviendo con VIH.
  zh:
    description: 为HIV感染者提供护理、预防和支持服务，包括医疗和牙科、药房、心理健康咨询、食物分发和个案管理。
  ar:
    description: رعاية فيروس نقص المناعة البشرية، الوقاية والخدمات الداعمة بما في ذلك الرعاية الطبية وطب الأسنان، والصيدلية، والاستشارات الصحية النفسية، ومخزن طعام، وإدارة الحالات للمتعايشين مع HIV.
communities-for-recovery:
  vi:
    description: Dịch vụ hỗ trợ phục hồi do đồng đẳng dẫn dắt cho người gặp vấn đề về sử dụng chất và sức khỏe tâm thần — bao gồm huấn luyện phục hồi, hỗ trợ việc làm và hoạt động xã hội tỉnh táo.
  es:
    description: Servicios de apoyo a la recuperación dirigidos por pares para personas con desafíos de uso de sustancias y salud mental — coaching de recuperación, apoyo laboral y actividades sociales en sobriedad.
  zh:
    description: 由同伴主导的康复支持服务，面向有物质使用和心理健康挑战的人——包括康复辅导、就业支持和清醒社交活动。
  ar:
    description: خدمات دعم التعافي بقيادة الأقران للأشخاص الذين يواجهون تحديات في تعاطي المواد والصحة النفسية — بما في ذلك تدريب التعافي ودعم التوظيف وأنشطة اجتماعية بدون كحول.
