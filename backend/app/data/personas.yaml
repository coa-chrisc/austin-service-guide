    content: 我们租的。房子是房东的，但他刚把房产税单寄给我们，要求我们支付一部分。我们俩都是67岁。
    delay_ms: 1300
  - role: assistant
    content: 这一点值得核实。租户权益组织可以告诉你们，你们的租约是否允许房东这样做。你们用Medicare吗？先生有没有什么需要长期管理的健康问题？
    delay_ms: 1100
  - role: user
    content: 对，我们都用Medicare。他有糖尿病，加上其他费用，他的药费越来越贵。
    delay_ms: 1300
  - role: assistant
    content: 明白了。炎热天气对糖尿病患者负担很大，所以我准备的计划会先帮你们在夏天让家里保持凉爽，然后是面向长者的住房帮助，以及一家有药房、按收入收费的医疗中心。我也会加上一个租户权益组织，帮你们处理房产税的问题。请稍等…
    delay_ms: 1100
