equity-east-austin-zh:
  id: equity-east-austin-zh
  label: East Austin — displacement (中文)
  language: zh
  seed_profile:
    age_range: 60s
    household_size: 2
    zip_code: '78702'
    housing_situation: renting
    employment_status: part-time
    income_bracket: $10,000-$20,000
    insurance_status: medicare
    has_children: false
    immediate_needs:
    - housing
    - utilities
    - healthcare
    languages_spoken:
    - zh
    - en
    has_chronic_conditions: true
    primary_language: zh
  opening_message: 我们在东奥斯汀住了三十多年。今年房租又涨了，房产税单也越来越严重。我和我先生都靠固定收入生活。我们不想离开这个社区。有什么可以帮助我们这样的人的资源吗？
  persona_note: Mandarin-speaking long-term East Austin household facing the same displacement squeeze
    as the English variant. Respond in simplified Chinese.
  script:
  - role: assistant
    content: 在一个社区住了三十年是真正的根基 — 我会尽力帮你们留下来。先问几个问题：你们和先生是这间房子的房主，还是从房东那里租的？你们大概多大年龄？
    delay_ms: 900
  - role: user
    content: 我们租的。房子是房东的，但他刚把房产税单寄给我们，要求我们支付一部分。我们俩都是67岁。
    delay_ms: 1300
  - role: assistant
    content: 这个其实很重要 — 房东不能合法地这样把房产税转嫁给你们。我会在住房稳定方案旁边标注一个租户权益资源。你们用Medicare吗？先生有没有什么需要长期管理的健康问题？
    delay_ms: 1100
  - role: user
    content: 对，我们都用Medicare。他有糖尿病，加上其他费用，他的药费越来越贵。
    delay_ms: 1300
  - role: assistant
    content: 明白了。我会准备一个计划，包含住房稳定、水电费帮助、长者服务和一个低费用处方药项目。请稍等…
    delay_ms: 1100
refugee-food-ar:
  id: refugee-food-ar
  label: Refugee family — food + coordination (العربية)
  language: ar
  seed_profile:
    age_range: 30s
    household_size: 5
    zip_code: '78758'
    housing_situation: renting
    employment_status: part-time
    income_bracket: $10,000-$20,000
    insurance_status: uninsured
    has_children: true
    immediate_needs:
    - food
    - healthcare
    - education
    languages_spoken:
    - ar
    is_refugee_or_immigrant: true
    primary_language: ar
  opening_message: وصلنا إلى أوستن قبل ثمانية أشهر. أطفالي في المدرسة لكننا ما زلنا نحاول ترتيب أمورنا.
    أخصائية الحالة ساعدتنا في البداية لكنني لم أسمع منها منذ أسابيع. الطعام عندنا قليل ولا أعرف أي طبيب
    آخذ صغيري إليه. هل تستطيع المساعدة؟
  persona_note: Arabic-speaking refugee family — same coordination gap as the English variant. Respond
    in Arabic.
  script:
  - role: assistant
    content: أهلاً بكم في أوستن — وأنا آسف أن أخصائية الحالة لم تتواصل معكم. دعيني أرى كيف يمكنني المساعدة.
      كم عدد أفراد عائلتك، وكم أعمار أطفالك؟
    delay_ms: 900
  - role: user
    content: نحن خمسة. أنا وزوجي وثلاثة أطفال — في الثامنة والسادسة والثانية من العمر. الصغير عمره سنتان
      وعنده سعال شديد منذ أسبوع.
    delay_ms: 1300
  - role: assistant
    content: 'شكراً — السعال المستمر عند طفل في الثانية يحتاج إلى فحص هذا الأسبوع. سؤالان آخران: هل لديكم
      أي تأمين صحي حالياً، وما اللغة الأنسب لكم في المواعيد الطبية؟'
    delay_ms: 1100
  - role: user
    content: لا تأمين لأي منا. العربية هي الأنسب — إنجليزيتي تكفي للتسوق لكن ليس عند الطبيب.
    delay_ms: 1300
  - role: assistant
    content: حسناً. سأرتب لكم عيادة تستقبل المرضى بدون تأمين ولديها موظفون يتكلمون العربية، ومخزن طعام
      يعرف العائلات اللاجئة، وسأبلغ منسقاً حتى لا تضطروا للبدء من جديد. لحظة من فضلك…
    delay_ms: 1100
