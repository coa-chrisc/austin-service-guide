# Demo personas for the ?demo=1 launcher and POST /api/v1/intake/load-persona.
# Optional: a pack without this file offers no personas. Each entry seeds a
# ResidentProfile, an opening message and an optional scripted dialogue.
# persona_note is appended after the shared hybrid-note prefix in
# app/services/personas.py.
heat-outdoor-worker:
  id: heat-outdoor-worker
  label: Heat — outdoor worker, broken AC
  language: en
  seed_profile:
    age_range: 40s
    household_size: 4
    zip_code: '78744'
    housing_situation: renting
    employment_status: full-time
    income_bracket: $20,000-$30,000
    insurance_status: uninsured
    has_children: true
    immediate_needs:
    - utilities
    - healthcare
    languages_spoken:
    - en
    - es
    is_outdoor_worker: true
    has_ac: false
    has_chronic_conditions: true
    primary_language: es
  opening_message: Hi — I do roadway construction here in 78744. My AC unit broke last week and I can’t
    afford to fix it before the next heat wave. I’ve also got high blood pressure. Is there any help out
    there for someone like me?
  persona_note: 'Seed hypothesis: outdoor worker in extreme-heat exposure with no home cooling and a chronic
    condition that compounds heat risk. Likely fits for cooling centers, utility/heat assistance, and
    primary-care-level healthcare. But verify — the resident might be calling on behalf of a coworker,
    a parent, or a neighbor.'
  script:
  - role: assistant
    content: I'm so glad you reached out — heat illness can escalate fast for someone in your situation.
      Let me ask a few quick questions so I can match you to the right help. First, is anyone else in
      your household at risk too — kids, an older parent, anyone with health conditions?
    delay_ms: 900
  - role: user
    content: Yeah, my wife and two kids live with me. The kids are fine but my wife has asthma and the
      heat makes it worse.
    delay_ms: 1200
  - role: assistant
    content: 'Thank you — that''s important. With your blood pressure and her asthma, both of you are
      heat-vulnerable. Two more quick things: are you currently uninsured or do you have any coverage?
      And is the rent and utilities current, or are you behind?'
    delay_ms: 1100
  - role: user
    content: No insurance for me. Rent is paid but the electric bill is two months behind because I had
      to put money toward the AC repair quote.
    delay_ms: 1300
  - role: assistant
    content: 'Got it. I''m going to put together a plan that covers all three: somewhere cool right now,
      help paying down that electric bill plus the AC fix, and a clinic that will see you uninsured. One
      moment…'
    delay_ms: 1100
schools-anxious-student:
  id: schools-anxious-student
  label: Schools — anxious 7th grader
  language: en
  seed_profile:
    age_range: 40s
    household_size: 3
    zip_code: '78753'
    housing_situation: renting
    employment_status: full-time
    income_bracket: $30,000-$40,000
    insurance_status: employer
    has_children: true
    immediate_needs:
    - mental health
    languages_spoken:
    - en
    school_age_children:
    - grade: '7'
      district: AISD
      concerns:
      - anxiety
      - attendance
    primary_language: en
  opening_message: My daughter is in 7th grade and the last few months have been really hard — she’s missing
    school more often and I can tell her anxiety is getting worse. Her counselor at school is overloaded.
    Where can I get her real help?
  persona_note: 'Seed hypothesis: parent of a school-age child with rising mental-health concerns. Likely
    fits for school-based counseling, Communities In Schools (CIS), and youth mental-health programs.
    But verify whether the caller is the parent, a caregiver, the student themselves, or a teacher — the
    right next step differs by role.'
  script:
  - role: assistant
    content: I'm sorry you and your daughter are going through this. You're doing the right thing reaching
      out. Can you tell me a little more — has she said anything that worries you about her safety, or
      is it more about anxiety and withdrawal so far?
    delay_ms: 900
  - role: user
    content: Mostly anxiety. She's not talking about hurting herself but she cries before school and sometimes
      can't get out of bed. We've never been to a therapist before.
    delay_ms: 1300
  - role: assistant
    content: 'That''s helpful — and what you''re describing is exactly what school-based mental health
      programs are designed for. Quick question on logistics: which school does she attend, and do you
      have insurance through your job?'
    delay_ms: 1100
  - role: user
    content: She's at Lamar Middle School in AISD. We have insurance through my work but the deductible
      is huge.
    delay_ms: 1200
  - role: assistant
    content: Good — there are programs that meet kids at school so you don't burn through that deductible.
      Let me put together a plan with a school-based counseling option first, plus a backup community
      provider in case you want a second opinion. One moment…
    delay_ms: 1100
equity-east-austin:
  id: equity-east-austin
  label: East Austin — displacement squeeze
  language: en
  seed_profile:
    age_range: 60s
    household_size: 2
    zip_code: '78702'
    housing_situation: renting
    employment_status: part-time
    income_bracket: $10,000-$20,000
    insurance_status: medicare
    has_children: false
    immediate_needs:
    - housing
    - utilities
    - healthcare
    languages_spoken:
    - en
    - es
    has_chronic_conditions: true
    primary_language: es
  opening_message: We’ve lived in East Austin for over thirty years. Our rent went up again this year
    and the property tax notices keep getting worse. My husband and I are both on fixed income. We don’t
    want to leave the neighborhood. What’s out there for people like us?
  persona_note: 'Seed hypothesis: long-term East Austin household facing displacement pressure — rent
    + property tax burden on fixed income. Likely fits for housing-stability programs, utility assistance,
    senior services, and tax-relief programs. Pay attention to language preference (Spanish) and to whether
    they own vs rent — the seed says renting but they mentioned property tax notices, which may indicate
    ownership.'
  script:
  - role: assistant
    content: 'Thirty years in one neighborhood is a real anchor — I''ll do my best to help you stay. A
      couple quick questions: do you and your husband own the home, or are you renting from a landlord?
      And how old are you both, roughly?'
    delay_ms: 900
  - role: user
    content: We rent. Our landlord owns the house but he just sent us the property tax notice and asked
      us to pay part of it. We're both 67.
    delay_ms: 1300
  - role: assistant
    content: That's actually important — the landlord can't legally pass property tax onto you that way.
      I'll flag a tenant-rights resource alongside the housing-stability options. Are you on Medicare,
      and is your husband managing any chronic conditions I should keep in mind?
    delay_ms: 1100
  - role: user
    content: Yes, both on Medicare. He has diabetes and his medications are getting expensive on top of
      everything else.
    delay_ms: 1300
  - role: assistant
    content: Understood. I'll put together a plan that covers housing stability, utility help, senior
      services, and a low-cost prescription program. One moment…
    delay_ms: 1100
refugee-food:
  id: refugee-food
  label: Refugee family — food + coordination
  language: en
  seed_profile:
    age_range: 30s
    household_size: 5
    zip_code: '78758'
    housing_situation: renting
    employment_status: part-time
    income_bracket: $10,000-$20,000
    insurance_status: uninsured
    has_children: true
    immediate_needs:
    - food
    - healthcare
    - education
    languages_spoken:
    - en
    is_refugee_or_immigrant: true
    primary_language: ar
  opening_message: We arrived in Austin eight months ago. My kids are in school but we’re still figuring
    things out. My case worker helped at first but I haven’t heard from her in weeks. We’re running short
    on food and I don’t know which doctor to take my youngest to. Can you help?
  persona_note: 'Seed hypothesis: refugee/immigrant family, post-resettlement transition, primary language
    Arabic, lost touch with their case worker. Likely fits for food pantries with refugee experience,
    community health clinics, school enrollment support, and re-engagement with a resettlement partner.
    Treat this as a coordination problem — surface multiple partners and call out the gap, don’t just
    hand off another phone number.'
  script:
  - role: assistant
    content: Welcome to Austin — and I'm sorry your case worker hasn't been in touch. Let me see if I
      can help. How many people are in your family, and what ages are your children?
    delay_ms: 900
  - role: user
    content: There are five of us. My husband and me, and three kids — eight, six, and two years old.
      The two-year-old has had a bad cough for a week.
    delay_ms: 1300
  - role: assistant
    content: 'Thank you — a persistent cough at age two needs to be looked at this week. Two more questions:
      do any of you have insurance right now, and which language is most comfortable for medical appointments?'
    delay_ms: 1100
  - role: user
    content: No insurance for any of us. Arabic is best — my English is okay for groceries but not for
      the doctor.
    delay_ms: 1300
  - role: assistant
    content: Got it. I'll line up a clinic that takes uninsured patients and has Arabic-speaking staff,
      a food pantry that knows refugee families, and I'll flag this to a coordinator so you don't have
      to keep starting over. One moment…
    delay_ms: 1100
heat-outdoor-worker-vi:
  id: heat-outdoor-worker-vi
  label: Heat — outdoor worker (Tiếng Việt)
  language: vi
  seed_profile:
    age_range: 40s
    household_size: 4
    zip_code: '78744'
    housing_situation: renting
    employment_status: full-time
    income_bracket: $20,000-$30,000
    insurance_status: uninsured
    has_children: true
    immediate_needs:
    - utilities
    - healthcare
    languages_spoken:
    - vi
    - en
    is_outdoor_worker: true
    has_ac: false
    has_chronic_conditions: true
    primary_language: vi
  opening_message: Chào bạn — tôi làm xây dựng đường ở khu 78744. Máy lạnh nhà tôi bị hỏng tuần trước
    và tôi không có đủ tiền sửa trước khi đợt nóng tới. Tôi cũng bị huyết áp cao. Có chương trình hỗ trợ
    nào không?
  persona_note: Vietnamese-speaking outdoor worker with the same heat-vulnerability profile as the English
    variant. Respond in Vietnamese. The service catalog is English-canonical — translate service names
    and instructions on the fly.
  script:
  - role: assistant
    content: Tôi rất mừng vì bạn đã liên hệ — bệnh nhiệt có thể trở nặng nhanh với người trong tình trạng
      của bạn. Để tôi hỏi vài câu để giới thiệu đúng dịch vụ. Trước tiên, trong nhà có ai khác cũng dễ
      bị ảnh hưởng không — trẻ em, người lớn tuổi, hoặc ai có bệnh nền?
    delay_ms: 900
  - role: user
    content: Vâng, vợ và hai con tôi sống cùng nhà. Hai cháu thì ổn nhưng vợ tôi bị hen suyễn và nắng
      nóng làm bệnh nặng hơn.
    delay_ms: 1300
  - role: assistant
    content: 'Cảm ơn bạn — điều đó rất quan trọng. Với huyết áp của bạn và bệnh hen của vợ, cả hai đều
      thuộc nhóm nguy cơ cao do nhiệt. Hai câu hỏi nữa: bạn có bảo hiểm y tế hay đang không có bảo hiểm?
      Và tiền nhà, tiền điện có đang trễ hạn không?'
    delay_ms: 1100
  - role: user
    content: Tôi không có bảo hiểm. Tiền nhà thì đã trả nhưng tiền điện trễ hai tháng vì tôi phải để dành
      tiền sửa máy lạnh.
    delay_ms: 1300
  - role: assistant
    content: 'Hiểu rồi. Tôi sẽ lập một kế hoạch bao gồm cả ba phần: nơi tránh nóng ngay bây giờ, hỗ trợ
      thanh toán hóa đơn điện cùng với sửa máy lạnh, và một phòng khám nhận bệnh nhân không bảo hiểm.
      Một chút thôi…'
    delay_ms: 1100
