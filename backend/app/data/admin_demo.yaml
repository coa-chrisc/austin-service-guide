# Synthetic admin-console demo data for the Austin reference pack.
# Everything here is invented for demonstration: counts, trends, people and
# emails are fictional (emails use example.com / example.gov). Optional: a pack
# without this file serves empty admin demo views. *_days_ago fields are
# relative to the day the server starts so the demo always looks current.
# Top-level keys: analytics, demographics, service_demand, languages, equity,
# demand_map, eligibility_rules, partner_gaps, reports, audit_log, staff,
# residents, council_districts.
#
# The figures agree with each other: total_sessions (the last 30 days) equals
# the sum of demand_map sessions, of languages session_count, of each
# demographics breakdown, and of the daily_sessions series the backend builds;
# equity.geographic and council_districts census shares match demand_map.
# backend/tests/test_admin_demo.py checks this.
analytics:
  total_sessions: 1247
  avg_matches_per_session: 6.8
  completion_rate: 0.74
  # Times the crisis-resource panel was shown (keyword interrupt or the model's
  # get_crisis_resources call), last 30 days. A count, not a diagnosis.
  crisis_resources_shown: 96
  # Same measure per week, oldest first; the last entry is the week ending
  # yesterday. Citywide only.
  crisis_weekly: [17, 19, 16, 9, 18, 22, 20, 19, 23, 21, 24, 22]
  # Previous 30-day periods, oldest first; months_ago 0 is the current period
  # (sessions = total_sessions, completed / sessions = completion_rate).
  monthly_trend:
  - months_ago: 5
    sessions: 802
    completed: 554
  - months_ago: 4
    sessions: 905
    completed: 633
  - months_ago: 3
    sessions: 978
    completed: 695
  - months_ago: 2
    sessions: 1063
    completed: 762
  - months_ago: 1
    sessions: 1151
    completed: 830
  - months_ago: 0
    sessions: 1247
    completed: 923
  highlights:
  - Sessions rose to 1,247 from 1,151 in the previous 30 days (+8%).
  - Completion improved to 74.0% from 72.1%; Vietnamese-language completion (66%) still trails the citywide rate.
  - Rental deposit help was the most common need with no open matching service (64 sessions).
  # Needs residents named that had no open matching service in the catalog
  # (counted per session, last 30 days).
  unmet_needs:
  - need: Rental deposit or first-month rent
    category: housing
    sessions: 64
    note: Emergency rental programs in the catalog are closed to new applicants.
  - need: Evening or weekend child care
    category: childcare
    sessions: 41
    note: No catalog provider lists hours after 6 pm.
  - need: Adult dental care without insurance
    category: healthcare
    sessions: 38
    note: One sliding-scale clinic, waitlisted.
  - need: Eviction legal help in Vietnamese or Arabic
    category: legal
    sessions: 22
    note: Legal aid lists interpreters on request only.
  - need: Rides to medical appointments outside bus routes
    category: transportation
    sessions: 19
    note: Paratransit eligibility excludes most callers.
  - need: Halal or culturally specific food pantry
    category: food
    sessions: 7
    note: Count under 11; shown suppressed in reports.
