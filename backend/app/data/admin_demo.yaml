# Report catalog for the admin Reports page. Each report renders at
# /admin/reports/<id> from the admin endpoints; PDF reports also ship as
# pre-rendered files under frontend/public/reports/<city config id>/<id>.pdf
# (frontend/scripts/render-reports.mjs). cadence (monthly | quarterly | weekly
# | on_demand) sets last_run: the latest scheduled run before today, at
# run_time in the city's local time.
reports:
- id: monthly-summary
  title: Monthly Service Navigation Summary
  audience: Director, council offices, funders
  description: Sessions and completion trend, top categories and matched services, language mix, crisis-resource displays (count only), catalog size, and what changed.
  category: Leadership
  format: PDF
  cadence: monthly
  schedule: Monthly, 1st at 7:00 AM
  run_time: '07:00'
  owner: data@example.gov
- id: unmet-need-partner-gaps
  title: Unmet Need and Partner Gap Report
  audience: Program managers, partner coordinators
  description: Needs residents named that had no open matching service, and referrals by partner that did not lead to a connection (partner-reported totals).
  category: Programs
  format: PDF + CSV
  cadence: monthly
  schedule: Monthly, 1st at 7:00 AM
  run_time: '07:00'
  owner: programs@example.gov
- id: language-access
  title: Language Access Report
  audience: Title VI / language-access office
  description: Sessions by language against the census share of residents with limited English, and completion by language.
  category: Equity
  format: PDF + CSV
  cadence: quarterly
  schedule: Quarterly, first day at 7:00 AM
  run_time: '07:00'
  owner: equity@example.gov
- id: equity-zip-district
