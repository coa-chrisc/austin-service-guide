# SearXNG settings for the research worker (#18).
#
# A private metasearch instance that only the worker calls, over Railway's
# private network (http://searxng.railway.internal:8080). It must never get a
# public domain: an open instance is quickly abused as a proxy.
#
# No secret here. The container reads server.secret_key from the SEARXNG_SECRET
# environment variable, set on Railway (see deploy/railway/README.md).
# Reference: https://docs.searxng.org/admin/settings/settings.html

use_default_settings:
  engines:
    # A short list keeps the instance fast and its upstream footprint small.
    # All three pass the query verbatim, so the worker's site: operator
    # reaches them; the worker still drops any hit that is off the site.
    # Not duckduckgo: from Railway's datacenter IPs it answered every request
    # with a CAPTCHA. Not mojeek or startpage: this SearXNG release marks
    # both inactive (proof-of-work CAPTCHAs). Not wikipedia: it refuses to
    # load without general.contact_url, and encyclopedia pages are rarely
    # where local service details live. Engines that fail are listed in the
    # JSON response's unresponsive_engines, which the worker reports as a
    # "Search degraded" job event.
    keep_only:
      - brave
      - google
      - bing

# google and bing ship disabled in SearXNG's defaults; turn them on.
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false

general:
  instance_name: "service-guide-search"

search:
  safe_search: 1
  # json is what the worker reads; html is kept for checking by hand.
  formats:
    - html
    - json

outgoing:
  # The default 3 s per engine is short for a datacenter-to-engine round trip.
  # Both stay under the worker's 20 s request timeout (providers/searxng.py).
  request_timeout: 10.0
  max_request_timeout: 15.0

server:
  # Private, single-client instance: the limiter (which needs Valkey) and
  # public-instance features stay off.
  limiter: false
  public_instance: false
  image_proxy: false
